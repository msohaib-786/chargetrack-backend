<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ChargeTrack CSMS - Secure Access Portal" />
  <title>ChargeTrack - Secure Login</title>
  <style>
    :root {
      --bg-base: #0a0f1d;
      --bg-surface: #111827;
      --bg-card: #1f2937;
      --border-color: #374151;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-green: #10b981;
      --radius-md: 8px;
      --radius-lg: 12px;
      --transition-fast: 0.15s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-image: radial-gradient(circle at 50% -20%, #1e3a8a 0%, transparent 40%);
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-green));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    }

    .brand-logo svg { width: 32px; height: 32px; fill: currentColor; }
    .brand-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      background: rgba(0, 0, 0, 0.1);
      transition: all var(--transition-fast);
    }

    .auth-tab.active {
      color: var(--text-main);
      background: transparent;
      border-bottom: 2px solid var(--accent-primary);
    }

    .auth-body { padding: 32px 24px; }
    .auth-form { display: none; flex-direction: column; gap: 20px; }
    .auth-form.active { display: flex; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .input-group { display: flex; flex-direction: column; gap: 8px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .custom-input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-size: 15px;
      outline: none;
      transition: border var(--transition-fast);
    }
    .custom-input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 4px;
    }
    .role-btn {
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .role-btn.active {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.1);
      color: var(--accent-primary);
    }

    .forgot-link {
      font-size: 13px;
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 600;
      align-self: flex-end;
      margin-top: -10px;
    }
    .forgot-link:hover { text-decoration: underline; }

    .btn-submit {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      transition: all var(--transition-fast);
    }
    .btn-submit:hover { background: var(--accent-primary-hover); transform: translateY(-1px); }

    /* Modal Styles */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: var(--radius-lg);
      width: 100%; max-width: 420px; padding: 28px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
    }
    .btn-close {
      position: absolute; top: 16px; right: 16px; background: transparent; border: none;
      color: var(--text-muted); font-size: 24px; cursor: pointer;
    }
    .modal-title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text-main); }
    .modal-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5; }

    /* Toasts */
    #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
    .toast { background: var(--bg-card); border-left: 4px solid var(--accent-primary); color: white; padding: 16px 20px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-weight: 600; font-size: 14px; animation: slideIn 0.3s forwards; }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      </div>
      <div class="brand-title">ChargeTrack CSMS</div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Sign In</div>
        <div class="auth-tab" onclick="switchTab('register')">Create Account</div>
      </div>

      <div class="auth-body">
        <!-- LOGIN FORM -->
        <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
          <div class="input-group">
            <label>System Role</label>
            <div class="role-selector">
              <button type="button" class="role-btn active" id="role-admin" onclick="selectRole('admin')">Admin CSMS</button>
              <button type="button" class="role-btn" id="role-driver" onclick="selectRole('driver')">EV Driver</button>
            </div>
            <input type="hidden" id="selectedRole" value="admin">
          </div>

          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" class="custom-input" required placeholder="name@domain.com" />
          </div>

          <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" class="custom-input" required placeholder="••••••••" />
          </div>

          <!-- Forgot Password Link -->
          <a href="javascript:void(0)" class="forgot-link" onclick="openResetModal()">Forgot Password?</a>

          <button type="submit" class="btn-submit">Secure Login</button>
        </form>

        <!-- REGISTER FORM -->
        <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
          <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="regName" class="custom-input" required placeholder="John Doe" />
          </div>
          <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="regEmail" class="custom-input" required placeholder="name@domain.com" />
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" id="regPass" class="custom-input" required minlength="6" placeholder="Create a strong password" />
          </div>
          <button type="submit" class="btn-submit" style="background: var(--accent-green); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">Register Account</button>
        </form>
      </div>
    </div>
  </div>

  <!-- PASSWORD RESET MODAL (2-STEP OTP FLOW) -->
  <div id="resetModal" class="modal-backdrop">
    <div class="modal-content">
      <button onclick="closeResetModal()" class="btn-close">&times;</button>
      
      <div class="modal-title-row">
        <span style="font-size: 22px;">🛡️</span>
        <h3 class="modal-title">Secure Password Reset</h3>
      </div>
      
      <p class="modal-desc" id="resetDesc">
        Enter your registered email address. A 6-digit One-Time Password (OTP) will be sent to verify your identity.
      </p>

      <!-- Step 1: Request OTP -->
      <form id="requestOtpForm" onsubmit="handleRequestOtp(event)" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="input-group">
          <label>Registered Email</label>
          <input type="email" id="resetEmail" class="custom-input" required placeholder="admin@chargetrack.co.za" />
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 4px;">Send OTP via Email</button>
      </form>

      <!-- Step 2: Verify OTP & Set New Password -->
      <form id="verifyOtpForm" onsubmit="handleVerifyOtp(event)" style="display: none; flex-direction: column; gap: 16px;">
        <div class="input-group">
          <label>6-Digit OTP Code</label>
          <input type="text" id="resetOtpCode" class="custom-input" required maxlength="6" pattern="\d{6}" placeholder="123456" style="letter-spacing: 4px; font-weight: 800; text-align: center; font-size: 18px;" />
        </div>
        <div class="input-group">
          <label>New Password</label>
          <input type="password" id="resetNewPass" class="custom-input" required minlength="6" placeholder="Enter new secure password" />
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 4px; background: var(--accent-green); box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">Verify & Reset Password</button>
      </form>

      <div id="resetStatusMsg" style="display: none; margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600;"></div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
      
      if (tab === 'login') {
        document.querySelectorAll('.auth-tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
      } else {
        document.querySelectorAll('.auth-tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
      }
    }

    // Role Selection
    function selectRole(role) {
      document.getElementById('role-admin').classList.remove('active');
      document.getElementById('role-driver').classList.remove('active');
      document.getElementById(`role-${role}`).classList.add('active');
      document.getElementById('selectedRole').value = role;
    }

    // Toast Notifications
    function showToast(msg, isSuccess = true) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.style.borderLeftColor = isSuccess ? 'var(--accent-green)' : 'var(--accent-red)';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    }

    // Authentication Handlers
    function handleLogin(e) {
      e.preventDefault();
      const role = document.getElementById('selectedRole').value;
      const email = document.getElementById('loginEmail').value;
      
      showToast(`Authenticating ${email}...`, true);
      
      setTimeout(() => {
        if (role === 'admin') {
          window.location.href = 'index.html';
        } else {
          window.location.href = 'driver.html';
        }
      }, 800);
    }

    function handleRegister(e) {
      e.preventDefault();
      showToast('Account created successfully! Please sign in.', true);
      setTimeout(() => switchTab('login'), 1500);
    }

    // --- 2-STEP OTP PASSWORD RESET LOGIC ---
    let generatedOtp = "";

    function openResetModal() {
      document.getElementById('resetModal').style.display = 'flex';
      document.getElementById('resetStatusMsg').style.display = 'none';
      
      // Reset to Step 1
      document.getElementById('requestOtpForm').style.display = 'flex';
      document.getElementById('verifyOtpForm').style.display = 'none';
      document.getElementById('requestOtpForm').reset();
      document.getElementById('verifyOtpForm').reset();
      document.getElementById('resetDesc').innerText = "Enter your registered email address. A 6-digit One-Time Password (OTP) will be sent to verify your identity.";
    }

    function closeResetModal() {
      document.getElementById('resetModal').style.display = 'none';
    }

    // Step 1: Generate OTP and transition UI
    function handleRequestOtp(e) {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value.trim();
      const statusEl = document.getElementById('resetStatusMsg');

      statusEl.style.display = 'block';
      statusEl.style.background = 'rgba(59, 130, 246, 0.15)';
      statusEl.style.color = '#60a5fa';
      statusEl.innerText = 'Connecting to mail server...';

      setTimeout(() => {
        // Generate a cryptographically simulated 6-digit OTP
        generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();

        // Switch UI to Step 2
        document.getElementById('requestOtpForm').style.display = 'none';
        document.getElementById('verifyOtpForm').style.display = 'flex';
        document.getElementById('resetDesc').innerHTML = `OTP sent to <strong>${email}</strong>. Please check your inbox.`;

        // Display the OTP on screen for prototype testing purposes
        statusEl.style.background = 'rgba(16, 185, 129, 0.15)';
        statusEl.style.color = '#34d399';
        statusEl.innerHTML = `✅ Email dispatched successfully.<br><br><span style="color: var(--text-muted); font-size: 11px;">PROTOTYPE DEMO NOTE: Since there is no live SMTP server attached, your OTP code is: <strong style="color: white; font-size: 14px;">${generatedOtp}</strong></span>`;
      }, 1200);
    }

    // Step 2: Validate OTP and update credentials
    function handleVerifyOtp(e) {
      e.preventDefault();
      const enteredOtp = document.getElementById('resetOtpCode').value.trim();
      const newPass = document.getElementById('resetNewPass').value;
      const email = document.getElementById('resetEmail').value.trim();
      const statusEl = document.getElementById('resetStatusMsg');

      // Validation check
      if (enteredOtp !== generatedOtp) {
        statusEl.style.background = 'rgba(239, 68, 68, 0.15)';
        statusEl.style.color = '#ef4444';
        statusEl.innerText = '❌ Invalid OTP code. Please check your email and try again.';
        return;
      }

      statusEl.style.background = 'rgba(59, 130, 246, 0.15)';
      statusEl.style.color = '#60a5fa';
      statusEl.innerText = 'Verifying OTP encryption key...';

      setTimeout(() => {
        // Mock DB Update for frontend prototype
        localStorage.setItem(`pwd_${email}`, newPass);

        statusEl.style.background = 'rgba(16, 185, 129, 0.15)';
        statusEl.style.color = '#34d399';
        statusEl.innerText = `✅ Authentication successful! Password updated for ${email}.`;

        setTimeout(() => closeResetModal(), 2500);
      }, 1000);
    }
  </script>
</body>
</html>
