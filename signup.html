<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ChargeTrack CSMS - Operator and EV Fleet Driver Registration Portal" />
  <title>ChargeTrack CSMS - Enterprise Registration</title>

  <!-- =========================================================================
       ENTERPRISE STYLESHEET (CSS)
       ========================================================================= -->
  <style>
    :root {
      --bg-base: #0a0f1d;
      --bg-surface: #111827;
      --bg-card: #1f2937;
      --border-color: #374151;
      --border-focus: #3b82f6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --text-dark: #d1d5db;
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --border-radius-lg: 16px;
      --border-radius-md: 8px;
      --transition-speed: 0.25s;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
      background: radial-gradient(circle at center, #111827 0%, #0a0f1d 100%);
    }

    .auth-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius-lg);
      width: 100%;
      max-width: 520px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-green));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 28px;
      color: white;
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.35);
      margin-bottom: 14px;
    }

    .brand-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dark);
    }

    .custom-input, .custom-select {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: var(--border-radius-md);
      font-size: 14px;
      outline: none;
      transition: all var(--transition-speed);
      width: 100%;
    }

    .custom-select {
      appearance: none;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%239ca3af%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 14px top 50%;
      background-size: 10px auto;
    }

    .custom-input:focus, .custom-select:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-top: 4px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-group input {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--accent-primary);
    }

    .btn-submit {
      background-color: var(--accent-primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: var(--border-radius-md);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-speed);
      box-shadow: 0 4px 6px rgba(59, 130, 246, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background-color: var(--accent-primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      background-color: var(--border-color);
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--accent-primary);
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }

    .auth-footer a:hover {
      color: #60a5fa;
      text-decoration: underline;
    }

    #toast-container { position: fixed; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 9999; }
    .toast { background: var(--bg-card); border-left: 4px solid var(--accent-red); color: white; padding: 16px 22px; border-radius: var(--border-radius-md); box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; animation: slideInRight 0.3s forwards; }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">⚡</div>
      <h1 class="brand-title">Create Operator Account</h1>
      <span class="brand-subtitle">Register for ChargeTrack CSMS System Access</span>
    </div>

    <!-- Registration Form -->
    <form id="signupForm" class="auth-form">
      <div class="input-group">
        <label for="fullName">Full Legal Name</label>
        <input type="text" id="fullName" class="custom-input" placeholder="e.g., Mohammed Sohaib" required />
      </div>

      <div class="input-group">
        <label for="email">Enterprise Email Address</label>
        <input type="email" id="email" class="custom-input" placeholder="operator@chargetrack.co.za" required autocomplete="email" />
      </div>

      <div class="form-row">
        <div class="input-group">
          <label for="role">Assigned Authorization Role</label>
          <select id="role" class="custom-select" required>
            <option value="Site Administrator">Site Administrator</option>
            <option value="Grid Operations Engineer">Grid Engineer</option>
            <option value="EV Fleet Driver">EV Fleet Driver</option>
          </select>
        </div>

        <div class="input-group">
          <label for="rfidTag">Primary RFID / Vehicle ID</label>
          <input type="text" id="rfidTag" class="custom-input" placeholder="BYD Dolphin Surf" required />
        </div>
      </div>

      <div class="form-row">
        <div class="input-group">
          <label for="password">Create Password</label>
          <input type="password" id="password" class="custom-input" placeholder="Min. 6 characters" required minlength="6" />
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" class="custom-input" placeholder="Re-enter password" required minlength="6" />
        </div>
      </div>

      <label class="checkbox-group">
        <input type="checkbox" id="popiaConsent" required />
        <span>I consent to encrypted storage of telemetry and personal data in strict compliance with South African POPIA regulations.</span>
      </label>

      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">Provision Account</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>
    </form>

    <div class="auth-footer">
      Already have an active account? <a href="login.html">Sign In Here</a>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- =========================================================================
       SIGNUP PROCESSING & STORAGE LOGIC
       ========================================================================= -->
  <script>
    /**
     * @file signup.js
     * Handles account creation validation, password matching, and persistent storage.
     */
    const signupForm = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    signupForm.addEventListener('submit', async function(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const role = document.getElementById('role').value;
      const rfidTag = document.getElementById('rfidTag').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Validate matching passwords
      if (password !== confirmPassword) {
        showToast("Password confirmation mismatch. Please verify entries.", "error");
        return;
      }

      submitBtn.disabled = true;
      btnText.innerText = "Registering Entity...";
      btnSpinner.style.display = "block";

      const newOperatorEntity = { fullName, email, role, rfidTag, password };

      // Persist to browser LocalStorage database
      const existingRecords = JSON.parse(localStorage.getItem('chargetrack_users') || '[]');
      if (existingRecords.some(user => user.email === email) || email === 'admin@chargetrack.co.za') {
        showToast("An account with this email address already exists.", "error");
        submitBtn.disabled = false;
        btnText.innerText = "Provision Account";
        btnSpinner.style.display = "none";
        return;
      }

      existingRecords.push(newOperatorEntity);
      localStorage.setItem('chargetrack_users', JSON.stringify(existingRecords));

      // Attempt cloud backend API synchronization
      try {
        await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newOperatorEntity)
        });
      } catch (cloudSyncError) {
        console.warn("[CSMS Signup] Cloud API offline. Stored locally in browser context.");
      }

      // Success sequence
      setTimeout(() => {
        btnText.innerText = "Account Created! Redirecting...";
        btnSpinner.style.display = "none";
        submitBtn.style.backgroundColor = "var(--accent-green)";
        showToast("Registration successful! Redirecting to secure login...", "success");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
      }, 900);
    });

    function showToast(message, messageType = "error") {
      const container = document.getElementById('toast-container');
      const toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.style.borderLeftColor = messageType === "success" ? "var(--accent-green)" : "var(--accent-red)";
      const iconSymbol = messageType === "success" ? "✅" : "⚠️";
      toastEl.innerHTML = `<span style="font-size:18px;">${iconSymbol}</span> <span>${message}</span>`;
      container.appendChild(toastEl);

      setTimeout(() => {
        toastEl.style.opacity = "0";
        toastEl.style.transition = "all 0.3s ease";
        setTimeout(() => toastEl.remove(), 300);
      }, 3500);
    }
  </script>
</body>
<!-- </html> -->
